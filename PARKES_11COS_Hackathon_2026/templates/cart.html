<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Store - Cart</title>
    <link rel="stylesheet" href="/static/main.css">
</head>
<body>
    <nav>
        <!-- TODO: Build your navigation bar -->
        <div class="left_nav">
            <h2>All store</h2>
        </div>
        <div class="center_nav">
            <a href="/products"><div class="button"><p>products</p></div></a>
            
        </div>
        <div class="right_nav">
            <a href="/cart"><div class="button"><p>Cart</p></div></a>
        </div>
    </nav>

    <div class="cart_main">
        <h1>Cart</h1>
        <div class="cart_items">
            {% for item in cart_items %}
            <div class="cart_item">
                <div class="cart_item_desc">
                    <h3>{{ item.name }}</h3>
                    <p>{{ item.price }} per item</p>
                </div>
                <div class="cart_amount_delete">
                    <p>{{ item.quantity }}</p>
                    <a href="/remove/{{ item.product_id }}">remove</a>
                </div>
            </div>
        {% endfor %}
        </div>
        <div class="space_filler">
            <br>
        </div>
        <div class="total">
            <h2>Total: ${{ total }}</h2>
        </div>

        <form method="post">
            <input type="hidden" value="">
            <button type="submit">Checkout</button>
        </form>
    </div>
</body>
</html>
