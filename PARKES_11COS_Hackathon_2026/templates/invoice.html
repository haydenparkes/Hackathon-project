<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Store - Invoice</title>
    <link rel="stylesheet" href="/static/main.css">
</head>
<body>
    <nav>
        <!-- TODO: Build your navigation bar -->
        <div class="left_nav">
            <h2>All store</h2>
        </div>
        <div class="center_nav">
            <a href="/products"><div class="button"><p>products</p></div></a>
            
        </div>
        <div class="right_nav">
            <a href="/cart"><div class="button"><p>Cart</p></div></a>
        </div>
    </nav>

    <div class="invoice">
        <div class="inv_text">
            <h1>invoice</h1>
            <div><h3>invoice id:</h3>
            <p>{{ invoice.invoice_id }}</p></div>
            <div><h3>Date:</h3>
            <p>{{ invoice.date }}</p></div>
            <div><h3>Item Data:</h3>
            {% for item in cart_items %}
            <p>{{ item }}</p></div>
            {% endfor %}
            <div><h3>Total:</h3>
            <p>{{ invoice.total }}</p></div>
        </div>
        
    </div>
</body>
</html>
